name: Schema Validation

on:
  push:
    paths:
      - "schemas/**"
      - "examples/machine-readable/**"
      - "examples/visual-parser/**"
      - "adapters/**"
      - "tools/**"
      - "tests/**"
  pull_request:
    paths:
      - "schemas/**"
      - "examples/machine-readable/**"
      - "examples/visual-parser/**"
      - "adapters/**"
      - "tools/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt pytest
      - run: pytest -q
      - run: python tools/promptless_card.py validate examples/machine-readable/visual-skill-card.example.json
      - run: python tools/promptless_card.py validate examples/machine-readable/vad-agent-card.example.json
      - run: python tools/promptless_card.py classify examples/machine-readable/skill-to-agent-upgrade.example.json
      - run: python tools/visual_card_parser.py validate-extraction examples/visual-parser/skill-card.extraction.json
      - run: python tools/visual_card_parser.py validate-extraction examples/visual-parser/agent-card.extraction.json
