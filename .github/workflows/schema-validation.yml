name: Schema Validation

on:
  push:
    paths:
      - "skills/vad-promptless/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "README.md"
      - ".github/workflows/schema-validation.yml"
  pull_request:
    paths:
      - "skills/vad-promptless/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "README.md"
      - ".github/workflows/schema-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/vad-promptless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt pytest
      - run: pytest -q
      - run: python tools/promptless_card.py validate examples/machine-readable/visual-skill-card.example.json
      - run: python tools/promptless_card.py validate examples/machine-readable/vad-agent-card.example.json
      - run: python tools/visual_card_parser.py validate-extraction examples/visual-parser/skill-card.extraction.json
      - run: python tools/self_describing_card.py validate examples/self-describing/visual-skill-card.self.json
